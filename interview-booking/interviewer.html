  <header class="topbar">

      <span class="brand-text">at~once<small>면접관</small></span>

  <main class="wrap narrow">
    <p class="muted" id="booting" style="text-align:center;padding:48px 0">불러오는 중…</p>

        <p class="hint" style="margin-top:0">가능한 시간을 체크하면 바로 저장돼요. 예약이 들어간 시간은 담당자만 풀 수 있어요.</p>
