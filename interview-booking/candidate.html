<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>면접 한 번에 — 후보자</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">면접 한 번에<small>후보자</small></span>
  </header>

  <main class="wrap narrow">
    <p class="muted" id="booting" style="text-align:center;padding:48px 0">불러오는 중…</p>
    <section class="card notice" id="setup" hidden>
      <h2>설정이 필요해요</h2>
      <p class="muted" id="setup-reason">담당자에게 링크를 다시 받아 주세요.</p>
    </section>

    <section id="main-view" hidden>
      <div class="link-head">
        <p class="eyebrow">면접 시간 선택</p>
        <h1 id="pos-title">불러오는 중…</h1>
        <p class="muted" id="greeting"></p>
      </div>

      <div class="card">
        <p class="hint" style="margin-top:0">
          면접관 일정이 모인 시간만 보여요. 예약한 뒤에도 다른 열린 시간으로 바꿀 수 있어요.
        </p>
        <div class="slots" id="slot-list"></div>
      </div>
      <p class="hint" style="text-align:center">이 화면은 나만 볼 수 있는 링크예요. 다른 사람에게 전달하지 마세요.</p>
    </section>

    <section class="card" id="error-view" hidden>
      <h2>링크를 열 수 없어요</h2>
      <p class="error" id="error-text"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/candidate.js"></script>
</body>
</html>
