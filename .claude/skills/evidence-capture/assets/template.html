<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<!-- 창 제목: 어떤 프로그램에서 무엇을 확인하는 장면인지 -->
<div class="title">Windows PowerShell — 프로젝트 (확인할 내용)</div>
<div class="body">

<!-- 터미널 명령과 출력: 실제 실행 결과를 그대로 옮긴다 -->
<pre><span class="prompt">PS C:\경로&gt;</span> <span class="cmd">실행한 명령</span>
<span class="g">실제 출력 첫 줄</span>
실제 출력 둘째 줄
</pre>

<!-- Claude Code 장면을 그릴 때 쓰는 모양 (필요 없으면 지운다) -->
<div class="user">&gt; 사용자가 입력한 문장</div>
<div class="step"><span class="dot">●</span> <span class="b">도구 이름</span> <span class="dim">(도구 설명)</span></div>
<div class="out"><span class="dim">⎿</span> 도구 결과 그대로</div>
<div class="box">질문 창이나 확인 창 내용</div>
<div class="step"><span class="dot">●</span> 응답 문장</div>

</div></body></html>
