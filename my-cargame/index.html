<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스카이 드라이브 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87b8e8; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; }

  #hud { position: fixed; top: 16px; left: 16px; display: none; flex-direction: column; gap: 8px;
         background: rgba(10, 20, 40, 0.55); padding: 14px 18px; border-radius: 14px; min-width: 230px;
         backdrop-filter: blur(4px); box-shadow: 0 4px 20px rgba(0,0,0,.25); }
  .row { display: flex; justify-content: space-between; font-size: 15px; }
  .row b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: rgba(255,255,255,.18); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; transition: width .15s; }
  #fuelBar { background: linear-gradient(90deg, #ffb703, #ffd166); }
  #hpBar { background: linear-gradient(90deg, #ef476f, #ff8fa3); }
  .label { font-size: 12px; opacity: .8; margin-bottom: 2px; }

  #mapWrap { position: fixed; top: 16px; right: 16px; display: none; border-radius: 50%; overflow: hidden;
             box-shadow: 0 4px 20px rgba(0,0,0,.3); border: 3px solid rgba(255,255,255,.6); }
  #help { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: none;
          background: rgba(10,20,40,.5); padding: 8px 16px; border-radius: 10px; font-size: 13px; white-space: nowrap; }
  #popup { position: fixed; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 800;
           color: #ffd166; text-shadow: 0 3px 12px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #damage { position: fixed; inset: 0; background: radial-gradient(transparent 40%, rgba(255,0,40,.6)); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #warn { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #ff5d73;
          text-shadow: 0 2px 8px rgba(0,0,0,.6); display: none; }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: linear-gradient(180deg, rgba(10,25,60,.55), rgba(10,25,60,.8)); text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: clamp(36px, 7vw, 72px); letter-spacing: 2px; text-shadow: 0 6px 24px rgba(0,0,0,.4);
                background: linear-gradient(90deg, #ffd166, #ff6b6b, #4cc9f0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { margin-top: 12px; font-size: 17px; opacity: .9; line-height: 1.6; }
  .keys { margin-top: 22px; display: grid; grid-template-columns: auto auto; gap: 6px 18px; font-size: 15px; text-align: left; }
  kbd { display: inline-block; background: #fff; color: #123; border-radius: 5px; padding: 1px 7px; font-weight: 700; font-size: 13px; box-shadow: 0 2px 0 #889; margin-right: 3px; }
  button { margin-top: 28px; padding: 14px 44px; font-size: 20px; font-weight: 800; border: none; border-radius: 40px; cursor: pointer;
           color: #fff; background: linear-gradient(90deg, #ff6b6b, #f77f00); box-shadow: 0 6px 20px rgba(247,127,0,.5); transition: transform .15s; }
  button:hover { transform: scale(1.06); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row"><span>점수</span><b id="score">0</b></div>
  <div class="row"><span>속도</span><b id="speed">0 km/h</b></div>
  <div class="row"><span>고도</span><b id="alt">0 m</b></div>
  <div class="row"><span>다음 링</span><b id="ringDist">-</b></div>
  <div><div class="label">연료</div><div class="bar"><div id="fuelBar"></div></div></div>
  <div><div class="label">내구도</div><div class="bar"><div id="hpBar"></div></div></div>
</div>
<div id="mapWrap"><canvas id="map" width="170" height="170"></canvas></div>
<div id="help"><kbd>W</kbd><kbd>S</kbd> 가속/감속 · <kbd>A</kbd><kbd>D</kbd> 회전 · <kbd>↑</kbd><kbd>↓</kbd> 상승/하강 · <kbd>Shift</kbd> 부스터 · <kbd>P</kbd> 일시정지</div>
<div id="popup"></div>
<div id="warn"></div>
<div id="damage"></div>

<div id="start" class="overlay">
  <h1>SKY DRIVE 3D</h1>
  <p>하늘을 나는 자동차로 도시 위를 비행하세요!<br>황금 링을 통과하면 점수와 연료를 얻습니다. 건물에 부딪히지 않게 조심하세요.</p>
  <div class="keys">
    <span><kbd>W</kbd> / <kbd>S</kbd></span><span>가속 / 감속</span>
    <span><kbd>A</kbd> / <kbd>D</kbd> 또는 <kbd>←</kbd> <kbd>→</kbd></span><span>좌우 회전</span>
    <span><kbd>↑</kbd> <kbd>Space</kbd> / <kbd>↓</kbd> <kbd>C</kbd></span><span>상승 / 하강</span>
    <span><kbd>Shift</kbd></span><span>부스터 (연료 많이 소모)</span>
    <span><kbd>P</kbd></span><span>일시정지</span>
  </div>
  <button id="startBtn">출발!</button>
</div>

<div id="over" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p id="overReason"></p>
  <p style="font-size:26px;margin-top:18px">점수 <b id="finalScore">0</b></p>
  <p id="best"></p>
  <button id="retryBtn">다시 하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- 기본 설정 ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const SKY = 0x8cc4f0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 250, 1300);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 4000);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x4d5a3c, 0.85));
const sunLight = new THREE.DirectionalLight(0xfff2dd, 0.9);
sunLight.position.set(400, 600, 200);
scene.add(sunLight);

const sunBall = new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff5c0, fog: false }));
sunBall.position.set(1600, 1200, -2400);
scene.add(sunBall);

// ---------- 지형 / 도시 ----------
const CITY = 1200, CELL = 60;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshLambertMaterial({ color: 0x5d7d4c }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(CITY * 2 + 40, CITY * 2 + 40), new THREE.MeshLambertMaterial({ color: 0x3b3f47 }));
asphalt.rotation.x = -Math.PI / 2;
asphalt.position.y = 0.05;
scene.add(asphalt);

// 도로 중앙선
const lineMat = new THREE.MeshBasicMaterial({ color: 0xd8c25a });
for (let i = -CITY; i <= CITY; i += CELL) {
  const a = new THREE.Mesh(new THREE.PlaneGeometry(0.8, CITY * 2), lineMat);
  a.rotation.x = -Math.PI / 2; a.position.set(i, 0.1, 0); scene.add(a);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(CITY * 2, 0.8), lineMat);
  b.rotation.x = -Math.PI / 2; b.position.set(0, 0.1, i); scene.add(b);
}

function makeWindowTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 128);
  for (let y = 6; y < 128; y += 14)
    for (let x = 5; x < 64; x += 14) {
      g.fillStyle = Math.random() < 0.35 ? '#fff3c4' : (Math.random() < 0.5 ? '#7d93a8' : '#56677a');
      g.fillRect(x, y, 9, 9);
    }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 5);
  return t;
}

const buildings = new Map(); // "i,j" -> {x,z,hw,hd,h}
const buildingAt = (x, z) => buildings.get(Math.floor(x / CELL) + ',' + Math.floor(z / CELL));

(function buildCity() {
  const list = [];
  const n = CITY / CELL;
  for (let i = -n; i < n; i++) {
    for (let j = -n; j < n; j++) {
      if (Math.random() < 0.12) continue; // 공원/광장
      const x = i * CELL + CELL / 2, z = j * CELL + CELL / 2;
      const w = 26 + Math.random() * 18, d = 26 + Math.random() * 18;
      const center = Math.max(0, 1 - Math.hypot(x, z) / CITY);
      const h = 15 + Math.random() * 45 + center * center * (60 + Math.random() * 220);
      list.push({ x, z, w, d, h });
      buildings.set(i + ',' + j, { x, z, hw: w / 2, hd: d / 2, h });
    }
  }
  const geo = new THREE.BoxGeometry(1, 1, 1);
  geo.translate(0, 0.5, 0);
  const mat = new THREE.MeshLambertMaterial({ map: makeWindowTexture() });
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const palette = [0xb8c4d6, 0xd9cbb0, 0x9fb7c9, 0xc9a98f, 0xe0e0e0, 0x8fa3b5, 0xd4b8a0];
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  list.forEach((b, idx) => {
    dummy.position.set(b.x, 0, b.z);
    dummy.scale.set(b.w, b.h, b.d);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx, dummy.matrix);
    mesh.setColorAt(idx, col.setHex(palette[Math.floor(Math.random() * palette.length)]));
  });
  scene.add(mesh);
})();

// 원경의 산
(function mountains() {
  const mat = new THREE.MeshLambertMaterial({ color: 0x5f7f6a, flatShading: true });
  for (let k = 0; k < 40; k++) {
    const a = (k / 40) * Math.PI * 2 + Math.random() * 0.1;
    const r = 2400 + Math.random() * 500;
    const h = 250 + Math.random() * 450;
    const m = new THREE.Mesh(new THREE.ConeGeometry(250 + Math.random() * 200, h, 6), mat);
    m.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
    scene.add(m);
  }
})();

// 구름
const clouds = [];
(function makeClouds() {
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  const sph = new THREE.SphereGeometry(1, 10, 8);
  for (let k = 0; k < 45; k++) {
    const g = new THREE.Group();
    const parts = 4 + Math.floor(Math.random() * 4);
    for (let p = 0; p < parts; p++) {
      const s = new THREE.Mesh(sph, mat);
      const r = 12 + Math.random() * 14;
      s.scale.set(r * 1.4, r * 0.8, r);
      s.position.set(p * 16 - parts * 8 + Math.random() * 6, Math.random() * 6, Math.random() * 14 - 7);
      g.add(s);
    }
    g.position.set((Math.random() - 0.5) * 3600, 260 + Math.random() * 180, (Math.random() - 0.5) * 3600);
    scene.add(g);
    clouds.push(g);
  }
})();

// ---------- 하늘 나는 자동차 ----------
const flames = [];
const hoverGlows = [];
function buildCar() {
  const car = new THREE.Group();
  const paint = new THREE.MeshPhongMaterial({ color: 0xe63946, shininess: 90, specular: 0x666666 });
  const dark = new THREE.MeshPhongMaterial({ color: 0x1d1f24, shininess: 30 });
  const chrome = new THREE.MeshPhongMaterial({ color: 0xcfd6dd, shininess: 120 });
  const glass = new THREE.MeshPhongMaterial({ color: 0x1b3a5c, shininess: 150, specular: 0xffffff, transparent: true, opacity: 0.85 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.75, 4.8), paint);
  body.position.y = 0.45; car.add(body);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.45, 1.0), paint);
  nose.position.set(0, 0.35, -2.75); car.add(nose);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.75, 2.3), glass);
  cabin.position.set(0, 1.2, 0.1); car.add(cabin);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 1.6), paint);
  roof.position.set(0, 1.62, 0.25); car.add(roof);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 4.8), new THREE.MeshPhongMaterial({ color: 0xffffff }));
  stripe.position.set(0, 0.84, 0); car.add(stripe);

  // 날개
  const wingGeo = new THREE.BoxGeometry(1.4, 0.1, 1.3);
  [-1, 1].forEach(s => {
    const w = new THREE.Mesh(wingGeo, paint);
    w.position.set(s * 1.85, 0.55, 0.9); w.rotation.z = s * -0.12; car.add(w);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.9), dark);
    tip.position.set(s * 2.55, 0.75, 1.0); car.add(tip);
  });
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 0.5), dark);
  spoiler.position.set(0, 1.25, 2.3); car.add(spoiler);
  [-0.9, 0.9].forEach(x => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.2), dark);
    p.position.set(x, 1.0, 2.3); car.add(p);
  });

  // 호버 바퀴 (수평으로 접힌 바퀴)
  const wheelGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.35, 20);
  const hubGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.37, 12);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
  [[-1.35, -1.55], [1.35, -1.55], [-1.35, 1.6], [1.35, 1.6]].forEach(([x, z]) => {
    const w = new THREE.Mesh(wheelGeo, dark); w.position.set(x, 0.1, z); car.add(w);
    const h = new THREE.Mesh(hubGeo, chrome); h.position.set(x, 0.1, z); car.add(h);
    const glow = new THREE.Mesh(new THREE.CircleGeometry(0.75, 20), glowMat);
    glow.rotation.x = Math.PI / 2; glow.position.set(x, -0.1, z); car.add(glow);
    hoverGlows.push(glow);
  });

  // 후방 제트 엔진
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  [-0.6, 0.6].forEach(x => {
    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.4, 0.6, 14), chrome);
    nozzle.rotation.x = Math.PI / 2; nozzle.position.set(x, 0.45, 2.65); car.add(nozzle);
    const fg = new THREE.ConeGeometry(0.3, 1, 12); fg.translate(0, 0.5, 0); fg.rotateX(Math.PI / 2);
    const flame = new THREE.Mesh(fg, flameMat); flame.position.set(x, 0.45, 2.95); car.add(flame);
    const cg = new THREE.ConeGeometry(0.16, 1, 10); cg.translate(0, 0.5, 0); cg.rotateX(Math.PI / 2);
    const core = new THREE.Mesh(cg, coreMat); core.position.set(x, 0.45, 2.95); car.add(core);
    flames.push(flame, core);
  });

  // 라이트
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfffbe0 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
  [-0.8, 0.8].forEach(x => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.05), headMat); hl.position.set(x, 0.42, -3.26); car.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.15, 0.05), tailMat); tl.position.set(x * 1.2, 0.62, 2.41); car.add(tl);
  });

  car.rotation.order = 'YXZ';
  return car;
}
const car = buildCar();
scene.add(car);

// 다음 링을 가리키는 화살표
const arrowGeo = new THREE.ConeGeometry(0.45, 1.6, 12);
arrowGeo.rotateX(Math.PI / 2);
const arrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: 0xffd166 }));
scene.add(arrow);

// ---------- 링 ----------
const RING_COUNT = 14;
const rings = [];
const ringGeo = new THREE.TorusGeometry(9, 1.1, 12, 40);
const ringMat = new THREE.MeshPhongMaterial({ color: 0xffc300, emissive: 0x996600, shininess: 120 });
function placeRing(mesh) {
  const x = (Math.random() - 0.5) * CITY * 1.8;
  const z = (Math.random() - 0.5) * CITY * 1.8;
  const b = buildingAt(x, z);
  const minY = b ? b.h + 16 : 18;
  mesh.position.set(x, Math.min(420, minY + Math.random() * 110), z);
  mesh.rotation.y = Math.random() * Math.PI;
}
for (let k = 0; k < RING_COUNT; k++) {
  const m = new THREE.Mesh(ringGeo, ringMat);
  placeRing(m);
  scene.add(m);
  rings.push(m);
}

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) togglePause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = (...codes) => codes.some(c => keys[c]);

// ---------- 게임 상태 ----------
const $ = id => document.getElementById(id);
let state = 'start';
const st = {};
const fwd = new THREE.Vector3();
let shake = 0, comboTimer = 0, combo = 0, time = 0;

function reset() {
  Object.assign(st, {
    pos: new THREE.Vector3(0, 70, 0), yaw: 0, speed: 0, vy: 0, turn: 0,
    pitchVis: 0, rollVis: 0, fuel: 100, hp: 100, score: 0, inv: 0, boosting: false,
  });
  combo = 0; comboTimer = 0;
  rings.forEach(placeRing);
}
reset();

const camPos = new THREE.Vector3(0, 80, 20);

function startGame() {
  reset();
  camPos.set(0, 76, 16);
  state = 'play';
  $('start').classList.add('hidden');
  $('over').classList.add('hidden');
  ['hud', 'mapWrap'].forEach(id => $(id).style.display = 'flex');
  $('help').style.display = 'block';
}
$('startBtn').onclick = startGame;
$('retryBtn').onclick = startGame;

function togglePause() {
  state = state === 'play' ? 'pause' : 'play';
  showWarn(state === 'pause' ? '일시정지 (P로 계속)' : '');
}

function gameOver(reason) {
  state = 'over';
  $('overReason').textContent = reason;
  $('finalScore').textContent = Math.floor(st.score);
  let best = 0;
  try {
    best = Number(localStorage.getItem('skydrive-best') || 0);
    if (st.score > best) { best = Math.floor(st.score); localStorage.setItem('skydrive-best', best); }
  } catch (e) {}
  $('best').textContent = '최고 기록: ' + Math.max(best, Math.floor(st.score));
  $('over').classList.remove('hidden');
  ['hud', 'mapWrap', 'help'].forEach(id => $(id).style.display = 'none');
  showWarn('');
}

let popupTimer;
function popup(text, color = '#ffd166') {
  const el = $('popup');
  el.textContent = text; el.style.color = color; el.style.opacity = 1;
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => el.style.opacity = 0, 700);
}
function showWarn(text) {
  $('warn').textContent = text;
  $('warn').style.display = text ? 'block' : 'none';
}
function hitFlash() {
  $('damage').style.opacity = 1;
  setTimeout(() => $('damage').style.opacity = 0, 150);
}

// ---------- 업데이트 ----------
function update(dt) {
  const s = st;
  const hasFuel = s.fuel > 0;
  s.boosting = hasFuel && down('ShiftLeft', 'ShiftRight') && s.speed > 5;
  const maxSpeed = s.boosting ? 130 : 75;

  // 가속 / 감속
  if (hasFuel && down('KeyW')) s.speed += 38 * dt;
  else if (down('KeyS')) s.speed -= 50 * dt;
  else s.speed -= s.speed * 0.18 * dt;
  if (s.boosting) s.speed += 60 * dt;
  if (s.speed > maxSpeed) s.speed -= (s.speed - maxSpeed) * 2.5 * dt;
  s.speed = Math.max(0, s.speed);

  // 회전
  const turnIn = (down('KeyA', 'ArrowLeft') ? 1 : 0) - (down('KeyD', 'ArrowRight') ? 1 : 0);
  s.turn += (turnIn - s.turn) * Math.min(1, dt * 5);
  s.yaw += s.turn * 1.45 * dt;

  // 상승 / 하강
  const climbIn = (down('ArrowUp', 'Space') ? 1 : 0) - (down('ArrowDown', 'KeyC') ? 1 : 0);
  const targetVy = hasFuel ? climbIn * 30 : -38;
  s.vy += (targetVy - s.vy) * Math.min(1, dt * 3);

  // 이동
  const prev = s.pos.clone();
  fwd.set(-Math.sin(s.yaw), 0, -Math.cos(s.yaw));
  s.pos.addScaledVector(fwd, s.speed * dt);
  s.pos.y += s.vy * dt;

  if (s.pos.y < 1.2) {
    s.pos.y = 1.2;
    s.vy = Math.max(0, s.vy);
    if (!hasFuel) { gameOver('연료가 바닥나 지상에 불시착했습니다.'); return; }
  }
  if (s.pos.y > 450) { s.pos.y = 450; s.vy = Math.min(0, s.vy); }

  const LIMIT = 1900;
  if (Math.abs(s.pos.x) > LIMIT || Math.abs(s.pos.z) > LIMIT) {
    s.pos.x = THREE.MathUtils.clamp(s.pos.x, -LIMIT, LIMIT);
    s.pos.z = THREE.MathUtils.clamp(s.pos.z, -LIMIT, LIMIT);
    showWarn('비행 구역 경계입니다! 돌아가세요');
  } else if (s.fuel > 0 && s.fuel < 20) {
    showWarn('⚠ 연료 부족! 링을 통과하세요');
  } else if (s.fuel <= 0) {
    showWarn('연료 없음 — 추락 중!');
  } else {
    showWarn('');
  }

  // 건물 충돌
  s.inv -= dt;
  const b = buildingAt(s.pos.x, s.pos.z);
  if (b && s.pos.y < b.h + 1 &&
      Math.abs(s.pos.x - b.x) < b.hw + 1.6 && Math.abs(s.pos.z - b.z) < b.hd + 1.6) {
    s.pos.copy(prev);
    if (s.inv <= 0) {
      s.hp -= 25;
      s.inv = 1;
      shake = 0.7;
      hitFlash();
      popup('쾅! -25', '#ff5d73');
      if (s.hp <= 0) { s.hp = 0; gameOver('건물과 충돌해 차량이 부서졌습니다.'); return; }
    }
    s.speed *= 0.2;
  }

  // 연료
  s.fuel = Math.max(0, s.fuel - dt * (1.3 + (s.boosting ? 4 : 0)));

  // 링 통과
  comboTimer -= dt;
  for (const r of rings) {
    if (r.position.distanceTo(s.pos) < 9.5) {
      combo = comboTimer > 0 ? combo + 1 : 1;
      comboTimer = 8;
      const pts = 100 * combo;
      s.score += pts;
      s.fuel = Math.min(100, s.fuel + 22);
      s.hp = Math.min(100, s.hp + 5);
      popup(combo > 1 ? `+${pts}  x${combo} 콤보!` : `+${pts}`);
      placeRing(r);
    }
  }
  s.score += s.speed * dt * 0.05;
}

function animateWorld(dt) {
  const s = st;
  time += dt;

  // 자동차 자세
  fwd.set(-Math.sin(s.yaw), 0, -Math.cos(s.yaw));
  s.pitchVis += (s.vy * 0.012 - s.pitchVis) * Math.min(1, dt * 4);
  s.rollVis += (s.turn * 0.5 * Math.min(1, 0.4 + s.speed / 60) - s.rollVis) * Math.min(1, dt * 4);
  car.position.copy(s.pos);
  car.position.y += Math.sin(time * 3) * 0.15;
  car.rotation.set(s.pitchVis, s.yaw, s.rollVis);
  car.visible = !(s.inv > 0 && Math.floor(time * 20) % 2 === 0);

  // 불꽃
  const power = s.fuel > 0 ? (0.25 + s.speed / 75) * (s.boosting ? 2.2 : 1) : 0.05;
  flames.forEach((f, i) => {
    const flick = 0.85 + Math.random() * 0.3;
    f.scale.set(1, 1, power * flick * (i % 2 ? 1.3 : 2.2));
  });
  flames.forEach((f, i) => { if (i % 2 === 0) f.material.color.setHex(s.boosting ? 0x4cc9f0 : 0xff9f1c); });
  hoverGlows.forEach(g => { g.material.opacity = s.fuel > 0 ? 0.55 + Math.sin(time * 12) * 0.25 : 0.1; });

  // 링 회전
  rings.forEach((r, i) => { r.rotation.y += dt * 0.8; r.position.y += Math.sin(time * 2 + i) * 0.02; });

  // 구름 이동
  clouds.forEach(c => { c.position.x += dt * 4; if (c.position.x > 1800) c.position.x = -1800; });

  // 가장 가까운 링
  let nearest = null, nd = Infinity;
  for (const r of rings) { const d = r.position.distanceTo(s.pos); if (d < nd) { nd = d; nearest = r; } }
  arrow.visible = state === 'play' && !!nearest;
  if (nearest) {
    arrow.position.set(s.pos.x, s.pos.y + 3.8, s.pos.z);
    arrow.lookAt(nearest.position);
    arrow.material.color.setHSL(0.12, 1, 0.55 + Math.sin(time * 6) * 0.15);
  }
  return { nearest, nd };
}

function updateCamera(dt) {
  const s = st;
  if (state === 'start') {
    const a = time * 0.3;
    camera.position.set(s.pos.x + Math.sin(a) * 14, s.pos.y + 4, s.pos.z + Math.cos(a) * 14);
    camera.lookAt(s.pos.x, s.pos.y + 0.8, s.pos.z);
    return;
  }
  const desired = new THREE.Vector3().copy(s.pos).addScaledVector(fwd, -15 - s.speed * 0.04);
  desired.y += 5 + s.vy * 0.05;
  camPos.lerp(desired, 1 - Math.exp(-dt * 5));
  camPos.y = Math.max(camPos.y, 1.5);
  camera.position.copy(camPos);
  if (shake > 0) {
    shake -= dt;
    camera.position.x += (Math.random() - 0.5) * shake * 1.5;
    camera.position.y += (Math.random() - 0.5) * shake * 1.5;
  }
  const look = new THREE.Vector3().copy(s.pos).addScaledVector(fwd, 10);
  look.y += 1.5;
  camera.lookAt(look);
  const fov = 68 + s.speed * 0.17;
  if (Math.abs(camera.fov - fov) > 0.05) {
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 3);
    camera.updateProjectionMatrix();
  }
}

// ---------- HUD / 미니맵 ----------
const mapCtx = $('map').getContext('2d');
function drawHUD(nearest, nd) {
  const s = st;
  $('score').textContent = Math.floor(s.score);
  $('speed').textContent = Math.round(s.speed * 3.6) + ' km/h' + (s.boosting ? ' 🔥' : '');
  $('alt').textContent = Math.round(s.pos.y) + ' m';
  $('ringDist').textContent = nearest ? `${Math.round(nd)} m ${nearest.position.y > s.pos.y + 5 ? '▲' : nearest.position.y < s.pos.y - 5 ? '▼' : '●'}` : '-';
  $('fuelBar').style.width = s.fuel + '%';
  $('hpBar').style.width = s.hp + '%';

  const W = 170, C = W / 2, RANGE = 700, sc = C / RANGE;
  const right = { x: Math.cos(s.yaw), z: -Math.sin(s.yaw) };
  const toMap = (wx, wz) => {
    const dx = wx - s.pos.x, dz = wz - s.pos.z;
    return [C + (dx * right.x + dz * right.z) * sc, C - (dx * fwd.x + dz * fwd.z) * sc];
  };
  mapCtx.fillStyle = 'rgba(15,30,55,0.85)';
  mapCtx.fillRect(0, 0, W, W);
  // 도시 경계
  mapCtx.strokeStyle = 'rgba(255,255,255,0.35)';
  mapCtx.lineWidth = 1.5;
  mapCtx.beginPath();
  [[-CITY, -CITY], [CITY, -CITY], [CITY, CITY], [-CITY, CITY]].forEach(([x, z], i) => {
    const [px, py] = toMap(x, z); i ? mapCtx.lineTo(px, py) : mapCtx.moveTo(px, py);
  });
  mapCtx.closePath(); mapCtx.stroke();
  // 링
  for (const r of rings) {
    let [px, py] = toMap(r.position.x, r.position.z);
    const dx = px - C, dy = py - C, len = Math.hypot(dx, dy);
    if (len > C - 6) { px = C + dx / len * (C - 6); py = C + dy / len * (C - 6); }
    mapCtx.fillStyle = r === nearest ? '#ffffff' : '#ffc300';
    mapCtx.beginPath(); mapCtx.arc(px, py, r === nearest ? 5 : 3.5, 0, Math.PI * 2); mapCtx.fill();
  }
  // 내 차
  mapCtx.fillStyle = '#ff4d5e';
  mapCtx.beginPath(); mapCtx.moveTo(C, C - 8); mapCtx.lineTo(C - 6, C + 6); mapCtx.lineTo(C + 6, C + 6); mapCtx.closePath(); mapCtx.fill();
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'pause') { renderer.render(scene, camera); return; }
  if (state === 'play') update(dt);
  const { nearest, nd } = animateWorld(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
  if (state === 'play') drawHUD(nearest, nd);
}
requestAnimationFrame(loop);
</script>
</body>
